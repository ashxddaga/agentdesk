<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>herdr // agentdesk</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/svg+xml" href="icon.svg" />
  <link rel="apple-touch-icon" href="icon.svg" />
  <meta name="theme-color" content="#07090e" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- TUI Header -->
  <header class="tui-header">
    <div class="tui-brand">
      <span class="tui-logo">&gt;_</span>
      <div class="tui-title">HERDR <span>// agentdesk</span></div>
    </div>
    <div class="tui-status-tag" id="conn-status-tag">
      <div class="tui-dot" id="conn-dot"></div>
      <span id="conn-label">ONLINE</span>
    </div>
  </header>

  <!-- Workspace Filter Strip (Herdr Style) -->
  <div class="ws-strip" id="ws-tab-strip">
    <button class="ws-tab active" data-ws="">[ ALL <span class="badge" id="ws-badge-all">9</span> ]</button>
    <!-- Dynamic workspaces injected via JS -->
  </div>

  <!-- Attention / Blocked Banner -->
  <div id="approval-banner">
    <div class="banner-header">
      <span>▲ ATTENTION: AGENT WAITING FOR INPUT</span>
      <span id="banner-pane-id">[w7:p1]</span>
    </div>
    <div class="banner-prompt" id="banner-prompt">Prompt text...</div>
    <div class="banner-actions">
      <button class="btn-tui-approve" id="banner-approve-btn">&gt; ONE-TAP APPROVE (y)</button>
      <button class="btn-tui-abort" id="banner-reject-btn">&gt; ABORT (^C)</button>
    </div>
  </div>

  <main>
    <!-- View 1: Active Panes (Cockpit) -->
    <section id="panes-view" class="tui-view active">
      <div class="tui-section-header">
        <span>ACTIVE TERMINAL PANES</span>
        <button id="btn-refresh" style="background:transparent; border:none; color:var(--cyan); cursor:pointer; font-family:var(--font-mono); font-size:11px;">[ REFRESH ]</button>
      </div>
      <div id="panes-container">
        <!-- Rendered by app.js -->
      </div>
    </section>

    <!-- View 2: Sessions & Search -->
    <section id="sessions-view" class="tui-view">
      <div class="tui-section-header">
        <span>CROSS-AGENT SESSIONS</span>
      </div>
      <input type="search" id="session-search-input" class="tui-search-input" placeholder="&gt; search transcripts across agy, opencode, freebuff…" />
      <div class="tui-filter-pills" id="agent-filter-pills">
        <button class="pill-opt active" data-agent="">ALL</button>
        <button class="pill-opt" data-agent="agy">AGY</button>
        <button class="pill-opt" data-agent="freebuff">FREEBUFF</button>
        <button class="pill-opt" data-agent="opencode">OPENCODE</button>
        <button class="pill-opt" data-agent="grok">GROK</button>
        <button class="pill-opt" data-agent="kimi">KIMI</button>
        <button class="pill-opt" data-agent="claude">CLAUDE</button>
      </div>
      <div id="sessions-list">
        <!-- Rendered by app.js -->
      </div>
    </section>
  </main>

  <!-- Terminal Drawer Modal -->
  <div class="terminal-modal-overlay" id="terminal-modal-overlay">
    <div class="terminal-modal-frame" id="terminal-modal-frame">
      <div class="tui-drawer-header">
        <span class="tui-drawer-title" id="terminal-pane-title">TERMINAL // w3:p8</span>
        <button class="tui-btn-close" id="terminal-close-btn">[ ESC / CLOSE ]</button>
      </div>
      <div class="terminal-stream-box" id="terminal-stream-content">Loading stream…</div>
      
      <!-- Keypad row -->
      <div class="tui-keypad">
        <button class="keycap" data-key="y&#10;">y + ↵</button>
        <button class="keycap" data-key="&#10;">↵ Enter</button>
        <button class="keycap" data-key="n&#10;">n</button>
        <button class="keycap" data-key="&#x03;">^C Abort</button>
        <button class="keycap" data-key="&#x1b;">Esc</button>
        <button class="keycap" id="btn-tui-scroll">⬇ End</button>
      </div>

      <div class="tui-input-line">
        <span class="tui-prompt-symbol">&gt;</span>
        <input type="text" class="tui-input-text" id="tui-input-box" placeholder="send text or prompt..." />
        <button class="btn-tui-send" id="btn-tui-send">SEND</button>
      </div>
    </div>
  </div>

  <!-- Session Details Modal -->
  <div class="terminal-modal-overlay" id="session-detail-overlay">
    <div class="terminal-modal-frame" id="session-detail-frame">
      <div class="tui-drawer-header">
        <span class="tui-drawer-title" id="session-modal-title">SESSION LOG</span>
        <button class="tui-btn-close" id="session-close-btn">[ CLOSE ]</button>
      </div>
      <div class="terminal-stream-box" id="session-modal-body" style="background:#080a0f;">
        Loading transcript…
      </div>
      <div class="tui-input-line" style="justify-content: flex-end;">
        <button class="btn-tui-send" id="btn-tui-transfer" style="color:var(--cyan); border-color:var(--cyan);">
          &gt; DISPATCH HANDOFF ↵
        </button>
      </div>
    </div>
  </div>

  <!-- Toast Notification -->
  <div class="tui-toast" id="tui-toast">✓ COMMAND DELIVERED</div>

  <!-- Bottom Navigation -->
  <nav class="tui-nav">
    <button class="tui-nav-btn active" data-view="panes-view">
      <span>⚡ 1:PANES</span>
    </button>
    <button class="tui-nav-btn" data-view="sessions-view">
      <span>🔍 2:SESSIONS</span>
    </button>
  </nav>

  <script src="app.js"></script>
</body>
</html>
